server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: notification_html_telegram_standalone_service

  threads:
    virtual:
      enabled: true

  # Render API errors (e.g. ResponseStatusException 400/404) as RFC 9457 Problem Details
  mvc:
    problemdetails:
      enabled: true

  config:
    import:
    - optional:file:.env[.properties]
    - classpath:mongodb.yaml
    - classpath:telegram.yaml
    - classpath:management.yaml

# CORS allow-list for the /login endpoints.
cors:
  # Comma-separated list of allowed origins, e.g. "https://app.example.com,https://www.example.com".
  # "*" = allow any origin (default). Add "null" if you also open index.html from disk (file://).
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Public base URL of this service, used as the Telegram Login Widget origin / return_to.
app:
  public-url: ${APP_PUBLIC_URL:https://item-4-tg-app.onrender.com}